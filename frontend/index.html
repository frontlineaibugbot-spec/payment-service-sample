<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --muted:    #8b949e;
      --text:     #c9d1d9;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #d29922;
      --orange:   #e3b341;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top nav ── */
    .top-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
      flex-shrink: 0;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand i { font-size: 16px; }
    .nav-sep { color: var(--border); user-select: none; }
    .nav-route {
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
    }
    .nav-spacer { flex: 1; }

    .base-url-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .base-url-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .base-url-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      width: 200px;
    }
    .base-url-input:focus { outline: none; border-color: var(--accent); }

    .ping-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .ping-btn:hover { border-color: var(--accent); color: var(--text); }
    .ping-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .ping-dot.ok  { background: var(--green); }
    .ping-dot.err { background: var(--red); }
    #pingMsg { font-size: 11px; color: var(--muted); min-width: 44px; }

    /* ── Page center ── */
    .page-center {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px 60px;
    }

    .payment-layout {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .payment-layout { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: rgba(88,166,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 14px;
      flex-shrink: 0;
    }
    .card-header-title { font-weight: 600; font-size: 14px; }
    .card-header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .card-body { padding: 22px 20px; }

    /* ── Form fields ── */
    .field-group { margin-bottom: 16px; }
    .field-group:last-child { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-ctrl {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13px;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
      -webkit-appearance: none;
    }
    .form-ctrl:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88,166,255,.12);
    }
    .form-ctrl::placeholder { color: var(--muted); }
    select.form-ctrl { cursor: pointer; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }

    .arrow-mid {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
      padding-bottom: 16px;
    }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 16px;
    }
    .section-divider-line { flex: 1; height: 1px; background: var(--border); }
    .section-divider-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      transition: opacity .15s, transform .1s;
      letter-spacing: .01em;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:active { transform: scale(.99); opacity: .8; }
    .btn-submit:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .spinner {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid rgba(13,17,23,.3);
      border-top-color: #0d1117;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .btn-submit.loading .spinner  { display: block; }
    .btn-submit.loading .btn-label { visibility: hidden; width: 0; overflow: hidden; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Response panel ── */
    .resp-sticky { position: sticky; top: 72px; }

    .resp-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    .resp-empty i { font-size: 36px; opacity: .5; }
    .resp-empty p { font-size: 13px; margin: 0; }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
    }
    .pill-ok  { background: rgba(63,185,80,.15); color: var(--green); }
    .pill-err { background: rgba(248,81,73,.15);  color: var(--red); }
    .pill-4xx { background: rgba(227,179,65,.15); color: var(--orange); }

    /* Pipeline */
    .pipeline { display: flex; flex-direction: column; gap: 0; }

    .pipe-step { display: flex; gap: 14px; }
    .pipe-left { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
    .pipe-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(88,166,255,.15);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .pipe-line { flex: 1; width: 1.5px; background: var(--border); margin: 4px 0; }
    .pipe-content { padding-bottom: 20px; flex: 1; min-width: 0; }
    .pipe-step:last-child .pipe-content { padding-bottom: 0; }
    .pipe-step:last-child .pipe-line { display: none; }

    .pipe-step-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
      margin-top: 4px;
    }

    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(48,54,61,.5);
    }
    .kv-row:last-child { border-bottom: none; }
    .kv-key { color: var(--muted); }
    .kv-val { font-family: monospace; color: var(--text); }
    .kv-val.accent { color: var(--yellow); font-weight: 600; }

    .total-box {
      background: rgba(63,185,80,.08);
      border: 1px solid rgba(63,185,80,.25);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
    .total-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .total-value { font-size: 20px; font-weight: 700; color: var(--green); font-family: monospace; }

    /* Tabs */
    .resp-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .resp-tab {
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: color .15s;
    }
    .resp-tab:hover { color: var(--text); }
    .resp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .resp-pane { display: none; }
    .resp-pane.active { display: block; }

    /* JSON block */
    .json-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
      font-size: 12px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .j-key  { color: #79c0ff; }
    .j-str  { color: #a5d6ff; }
    .j-num  { color: #f2cc60; }
    .j-bool { color: #ff7b72; }
    .j-null { color: var(--muted); }

    /* Action buttons */
    .resp-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Toast ── */
    #toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      max-width: 360px;
      pointer-events: none;
    }
    .toast-card {
      background: #160c0c;
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 13px 15px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      pointer-events: all;
      animation: toastIn .22s ease;
    }
    .toast-card.ok {
      background: #0c160d;
      border-color: var(--green);
    }
    .toast-icon { font-size: 17px; flex-shrink: 0; margin-top: 1px; color: var(--red); }
    .toast-card.ok .toast-icon { color: var(--green); }
    .toast-body { flex: 1; min-width: 0; }
    .toast-title { font-weight: 600; font-size: 13px; color: var(--red); }
    .toast-card.ok .toast-title { color: var(--green); }
    .toast-msg {
      font-size: 12px;
      color: #ffaaaa;
      margin-top: 3px;
      font-family: monospace;
      line-height: 1.45;
      word-break: break-word;
    }
    .toast-card.ok .toast-msg { color: #99ffaa; }
    .toast-x {
      background: none; border: none;
      color: var(--muted); font-size: 14px;
      cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0;
    }
    .toast-x:hover { color: var(--text); }
    .toast-card.out { animation: toastOut .18s ease forwards; }

    @keyframes toastIn  { from { opacity:0; transform:translateX(16px) } to { opacity:1; transform:translateX(0) } }
    @keyframes toastOut { from { opacity:1; transform:translateX(0) }    to { opacity:0; transform:translateX(16px) } }
  </style>
</head>
<body>

<!-- ═══ TOP NAV ═══ -->
<nav class="top-nav">
  <div class="brand">
    <i class="bi bi-globe2"></i>
    International Payment
  </div>
  <span class="nav-sep">·</span>
  <span class="nav-route">POST /pay-international</span>

  <div class="nav-spacer"></div>

  <div class="base-url-wrap">
    <span class="base-url-label">API</span>
    <input id="baseUrl" class="base-url-input" type="text"
      value="http://localhost:8001" placeholder="http://localhost:8001"
      oninput="saveUrl()">
  </div>
  <button class="ping-btn" onclick="pingServer()">
    <span id="pingDot" class="ping-dot"></span> Ping
  </button>
  <span id="pingMsg"></span>
</nav>

<!-- ═══ CENTERED LAYOUT ═══ -->
<div class="page-center">
  <div class="payment-layout">

    <!-- ──── LEFT: Payment Form ──── -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon"><i class="bi bi-send-fill"></i></div>
        <div>
          <div class="card-header-title">Cross-Border Payment</div>
          <div class="card-header-sub">Convert → Tax → Fee pipeline</div>
        </div>
      </div>

      <div class="card-body">
        <form id="payForm" onsubmit="submitPayment(event)" novalidate>

          <!-- Payment Identifiers -->
          <div class="section-divider">
            <div class="section-divider-line"></div>
            <div class="section-divider-label">Payment Details</div>
            <div class="section-divider-line"></div>
          </div>

          <div class="grid2">
            <div class="field-group">
              <label class="field-label">Payment ID</label>
              <input id="f-pid" class="form-ctrl" type="text"
                value="PAY-INT-001" placeholder="PAY-INT-001">
            </div>
            <div class="field-group">
              <label class="field-label">Amount</label>
              <input id="f-amount" class="form-ctrl" type="number"
                value="100" step="0.01" placeholder="0.00">
            </div>
          </div>

          <!-- Currency Conversion -->
          <div class="section-divider">
            <div class="section-divider-line"></div>
            <div class="section-divider-label">Currency</div>
            <div class="section-divider-line"></div>
          </div>

          <div class="grid3">
            <div class="field-group">
              <label class="field-label">From</label>
              <select id="f-from" class="form-ctrl">
                <option value="USD">USD — US Dollar</option>
                <option value="EUR">EUR — Euro</option>
                <option value="GBP">GBP — British Pound</option>
                <option value="INR">INR — Indian Rupee</option>
              </select>
            </div>
            <div class="arrow-mid"><i class="bi bi-arrow-right"></i></div>
            <div class="field-group">
              <label class="field-label">To</label>
              <select id="f-to" class="form-ctrl">
                <option value="EUR">EUR — Euro</option>
                <option value="USD">USD — US Dollar</option>
                <option value="GBP">GBP — British Pound</option>
                <option value="INR">INR — Indian Rupee</option>
              </select>
            </div>
          </div>

          <!-- Tax -->
          <div class="section-divider">
            <div class="section-divider-line"></div>
            <div class="section-divider-label">Tax</div>
            <div class="section-divider-line"></div>
          </div>

          <div class="grid2">
            <div class="field-group">
              <label class="field-label">Country</label>
              <select id="f-country" class="form-ctrl">
                <option value="US">US — United States</option>
                <option value="GB">GB — United Kingdom</option>
                <option value="DE">DE — Germany</option>
                <option value="FR">FR — France (unsupported)</option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label">Tax Type</label>
              <select id="f-taxtype" class="form-ctrl">
                <option value="standard">Standard</option>
                <option value="reduced">Reduced</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <div class="spinner"></div>
            <span class="btn-label">
              <i class="bi bi-send-fill"></i>&nbsp; Send Payment
            </span>
          </button>

        </form>
      </div>
    </div>

    <!-- ──── RIGHT: Response ──── -->
    <div class="resp-sticky">
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon"><i class="bi bi-receipt"></i></div>
          <div>
            <div class="card-header-title">Payment Result</div>
            <div class="card-header-sub">Conversion breakdown</div>
          </div>
          <div style="margin-left:auto;display:flex;gap:6px;">
            <button class="action-btn" onclick="clearResponse()">
              <i class="bi bi-x"></i> Clear
            </button>
            <button class="action-btn" id="copyBtn" onclick="copyResponse()">
              <i class="bi bi-clipboard"></i> Copy
            </button>
          </div>
        </div>

        <div class="card-body" id="responsePanel">
          <div class="resp-empty">
            <i class="bi bi-send"></i>
            <p>Send a payment request to see the breakdown here</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div id="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ═══════════════════════════════════════
// GLOBALS
// ═══════════════════════════════════════
let lastData = null;

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
const $ = id => document.getElementById(id);

function getBaseUrl() {
  return ($('baseUrl').value || 'http://localhost:8001').replace(/\/$/, '');
}

function saveUrl() {
  localStorage.setItem('intlPayUrl', $('baseUrl').value);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(obj) {
  return JSON.stringify(obj, null, 2).replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    m => {
      if (/^"/.test(m)) return /:$/.test(m) ? `<span class="j-key">${m}</span>` : `<span class="j-str">${m}</span>`;
      if (/true|false/.test(m)) return `<span class="j-bool">${m}</span>`;
      if (/null/.test(m))       return `<span class="j-null">${m}</span>`;
      return `<span class="j-num">${m}</span>`;
    }
  );
}

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
function toast(title, msg, ok = false) {
  const wrap = $('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast-card' + (ok ? ' ok' : '');
  el.innerHTML = `
    <i class="bi bi-${ok ? 'check-circle-fill' : 'exclamation-triangle-fill'} toast-icon"></i>
    <div class="toast-body">
      <div class="toast-title">${esc(title)}</div>
      ${msg ? `<div class="toast-msg">${esc(msg)}</div>` : ''}
    </div>
    <button class="toast-x" onclick="dismissToast(this.parentElement)"><i class="bi bi-x"></i></button>
  `;
  wrap.appendChild(el);
  const tid = setTimeout(() => dismissToast(el), ok ? 4000 : 6000);
  el._tid = tid;
}

function dismissToast(el) {
  if (!el || el.classList.contains('out')) return;
  clearTimeout(el._tid);
  el.classList.add('out');
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

// ═══════════════════════════════════════
// PING
// ═══════════════════════════════════════
async function pingServer() {
  const dot = $('pingDot'), msg = $('pingMsg');
  dot.className = 'ping-dot';
  msg.textContent = '…';
  try {
    const t0 = Date.now();
    const res = await fetch(getBaseUrl() + '/health', { signal: AbortSignal.timeout(3000) });
    const ms = Date.now() - t0;
    dot.className = 'ping-dot ' + (res.ok ? 'ok' : 'err');
    msg.textContent = res.ok ? `${ms}ms` : `${res.status}`;
  } catch {
    dot.className = 'ping-dot err';
    msg.textContent = 'offline';
  }
}

// ═══════════════════════════════════════
// RESPONSE RENDERING
// ═══════════════════════════════════════
function renderSuccess(status, data) {
  lastData = data;
  const fc = data.from_currency ?? '';
  const tc = data.to_currency ?? '';

  $('responsePanel').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <span class="status-pill pill-ok"><i class="bi bi-check-circle-fill"></i> ${status} Approved</span>
      <span style="font-size:12px;color:var(--muted);font-family:monospace;margin-left:auto;">${esc(data.payment_id ?? '')}</span>
    </div>

    <div class="resp-tabs">
      <button class="resp-tab active" onclick="switchPane('breakdown',this)">Breakdown</button>
      <button class="resp-tab" onclick="switchPane('raw',this)">Raw JSON</button>
    </div>

    <div id="pane-breakdown" class="resp-pane active">
      <div class="pipeline">

        <div class="pipe-step">
          <div class="pipe-left">
            <div class="pipe-dot">1</div>
            <div class="pipe-line"></div>
          </div>
          <div class="pipe-content">
            <div class="pipe-step-title"><i class="bi bi-currency-exchange"></i> Currency Conversion</div>
            <div class="kv-row"><span class="kv-key">Original</span><span class="kv-val">${esc(data.original_amount)} ${esc(fc)}</span></div>
            <div class="kv-row"><span class="kv-key">Rate</span><span class="kv-val">1 ${esc(fc)} = ${esc(data.exchange_rate)} ${esc(tc)}</span></div>
            <div class="kv-row"><span class="kv-key">Converted</span><span class="kv-val accent">${esc(data.converted_amount)} ${esc(tc)}</span></div>
          </div>
        </div>

        <div class="pipe-step">
          <div class="pipe-left">
            <div class="pipe-dot">2</div>
            <div class="pipe-line"></div>
          </div>
          <div class="pipe-content">
            <div class="pipe-step-title"><i class="bi bi-receipt-cutoff"></i> Tax</div>
            <div class="kv-row"><span class="kv-key">Country</span><span class="kv-val">${esc(data.country_code)}</span></div>
            <div class="kv-row"><span class="kv-key">Tax Type</span><span class="kv-val">${esc(data.tax_type)}</span></div>
            <div class="kv-row"><span class="kv-key">Rate</span><span class="kv-val">${((data.tax_rate ?? 0) * 100).toFixed(1)}%</span></div>
            <div class="kv-row"><span class="kv-key">Tax Amount</span><span class="kv-val">+${esc(data.tax_amount)} ${esc(tc)}</span></div>
            <div class="kv-row"><span class="kv-key">Subtotal</span><span class="kv-val accent">${esc(data.taxed_subtotal)} ${esc(tc)}</span></div>
          </div>
        </div>

        <div class="pipe-step">
          <div class="pipe-left">
            <div class="pipe-dot">3</div>
          </div>
          <div class="pipe-content">
            <div class="pipe-step-title"><i class="bi bi-gear-fill"></i> Processing Fee</div>
            <div class="kv-row"><span class="kv-key">Fee</span><span class="kv-val">+${esc(data.processing_fee)} ${esc(tc)}</span></div>
          </div>
        </div>

      </div>

      <div class="total-box">
        <span class="total-label">Grand Total</span>
        <span class="total-value">${esc(data.grand_total)} ${esc(tc)}</span>
      </div>
    </div>

    <div id="pane-raw" class="resp-pane">
      <div class="json-block">${highlight(data)}</div>
    </div>
  `;
}


function clearResponse() {
  lastData = null;
  $('responsePanel').innerHTML = `
    <div class="resp-empty">
      <i class="bi bi-send"></i>
      <p>Send a payment request to see the breakdown here</p>
    </div>`;
}

function copyResponse() {
  if (!lastData) return;
  navigator.clipboard.writeText(JSON.stringify(lastData, null, 2)).then(() => {
    const btn = $('copyBtn');
    btn.innerHTML = '<i class="bi bi-check2"></i> Copied';
    setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard"></i> Copy'; }, 1500);
  });
}

function switchPane(id, btn) {
  document.querySelectorAll('.resp-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.resp-tab').forEach(b => b.classList.remove('active'));
  $('pane-' + id).classList.add('active');
  btn.classList.add('active');
}

// ═══════════════════════════════════════
// SUBMIT
// ═══════════════════════════════════════
async function submitPayment(e) {
  e.preventDefault();

  const pid    = $('f-pid').value.trim();
  const amount = parseFloat($('f-amount').value);

  if (!pid) {
    toast('Validation Error', 'Payment ID is required.');
    return;
  }
  if (isNaN(amount)) {
    toast('Validation Error', 'Enter a valid amount.');
    return;
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.classList.add('loading');

  const body = {
    payment_id:    pid,
    amount:        amount,
    from_currency: $('f-from').value,
    to_currency:   $('f-to').value,
    country_code:  $('f-country').value,
    tax_type:      $('f-taxtype').value,
  };

  try {
    const res  = await fetch(getBaseUrl() + '/pay-international', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => null);

    if (res.ok) {
      renderSuccess(res.status, data);
      toast('Payment approved', `${data?.grand_total} ${data?.to_currency} grand total`, true);
    } else {
      // Parse error detail for the toast
      const detail = data?.detail;
      let errType = `HTTP ${res.status}`;
      let errMsg  = 'The server returned an error.';
      if (detail) {
        if (typeof detail === 'string') {
          errMsg = detail;
        } else {
          if (detail.error)   errType = detail.error;
          if (detail.message) errMsg  = detail.message;
        }
      }
      toast(errType, errMsg);
    }
  } catch (err) {
    toast('Network Error', 'Could not reach the server. Is it running?');
  }

  btn.disabled = false;
  btn.classList.remove('loading');
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
(function () {
  const saved = localStorage.getItem('intlPayUrl');
  if (saved) $('baseUrl').value = saved;
  pingServer();
})();
</script>
